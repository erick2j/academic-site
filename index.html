        <!-- for google scholar icon -->

            referrerpolicy="no-referrer"

    <body id="top">
        <!-- Navigation -->
        <nav class="navbar navbar-inverse navbar-static-top" role="navigation">
            <div class="container">
                <div class="navbar-header">
                    <button
                        type="button"
                        class="navbar-toggle collapsed"
                        data-toggle="collapse"
                        data-target="#bs-example-navbar-collapse-1"
                    >
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                </div>

                <!-- Collect the nav links, forms, and other content for toggling -->
                <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
                    <ul class="nav navbar-nav">
                        <li><a href="#top">Home</a></li>
                        <li><a href="#about">About</a></li>
                        <li><a href="#research">Research</a></li>
                        <li><a href="#teaching">Teaching</a></li>
                        <li><a href="pdfs/cv.pdf" target="_blank">CV</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="container">
            <div class="row">
                <!-- Main Column -->
                <div class="col-md-8">
                    <section id="about" data-include-html="html/aboutme.html">
                        <div>
                            <p>Loading About Me…</p>
                            <noscript>
                                <p>Enable JavaScript to view the About Me content.</p>
                            </noscript>
                        </div>
                    </section>

                    <section
                        id="research"
                        style="margin-top: 60px;"
                        data-include-html="html/research.html"
                        data-include-fragment="#research-content"
                    >
                        <div>
                            <p>Loading Research…</p>
                            <noscript>
                                <p>Enable JavaScript to view the Research section.</p>
                            </noscript>
                        </div>
                    </section>

                    <section
                        id="teaching"
                        style="margin-top: 60px;"
                        data-include-html="html/teaching.html"
                        data-include-fragment="#teaching-content"
                    >
                        <div>
                            <p>Loading Teaching…</p>
                            <noscript>
                                <p>Enable JavaScript to view the Teaching section.</p>
                            </noscript>
                        </div>
                    </section>
                </div>

                <!-- Contact Info and Profile Picture on the Sidebar -->
                <div class="col-md-4">
                    <section data-include-html="html/profile.html">
                        <div>
                            <p>Loading Profile…</p>
                            <noscript>
                                <p>Enable JavaScript to view the profile content.</p>
                            </noscript>
                        </div>
                    </section>

                    <section
                        style="margin-top: 30px;"
                        data-include-html="html/news.html"
                        data-include-fragment="#news-content"
                    >
                        <div>
                            <p>Loading News…</p>

                            </noscript>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <!-- /.container -->

        <!-- Other people may like it too! -->
        <a
            style="color: #b5bec9; font-size: 0.8em; float: right;"
            href="https://github.com/mavroudisv/plain-academic"
        >
            Plain Academic
        </a>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var includeTargets = document.querySelectorAll('[data-include-html]');

                includeTargets.forEach(function (element) {
                    var url = element.getAttribute('data-include-html');

                    if (!url) {
                        return;
                    }

                    fetch(url)
                        .then(function (response) {
                            if (!response.ok) {
                                throw new Error('Failed to load ' + url + ': ' + response.status);
                            }

                            return response.text();
                        })
                        .then(function (html) {
                            var fragmentSelector = element.getAttribute('data-include-fragment');

                            if (fragmentSelector) {
                                var parser = new DOMParser();
                                var parsed = parser.parseFromString(html, 'text/html');
                                var fragment = parsed.querySelector(fragmentSelector);

                                if (!fragment) {
                                    throw new Error('Fragment "' + fragmentSelector + '" not found in ' + url);
                                }

                                element.innerHTML = fragment.innerHTML;
                            } else {
                                element.innerHTML = html;
                            }
                        })
                        .catch(function (error) {
                            console.error(error);
                            element.innerHTML = '<p>Sorry, this content is unavailable right now.</p>';
                        });
                });
            });
        </script>
    </body>
</html>
